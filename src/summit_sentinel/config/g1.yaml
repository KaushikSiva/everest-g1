simulation:
  timestep: 0.002
  control_decimation: 10
  fall_base_height: 0.45
  fall_gravity_z: -0.35

controller:
  joint_names:
    - left_hip_pitch_joint
    - left_hip_roll_joint
    - left_hip_yaw_joint
    - left_knee_joint
    - left_ankle_pitch_joint
    - left_ankle_roll_joint
    - right_hip_pitch_joint
    - right_hip_roll_joint
    - right_hip_yaw_joint
    - right_knee_joint
    - right_ankle_pitch_joint
    - right_ankle_roll_joint
  kps: [100, 100, 100, 150, 40, 40, 100, 100, 100, 150, 40, 40]
  kds: [2, 2, 2, 4, 2, 2, 2, 2, 2, 4, 2, 2]
  default_angles: [-0.1, 0.0, 0.0, 0.3, -0.2, 0.0, -0.1, 0.0, 0.0, 0.3, -0.2, 0.0]
  torque_limits: [88, 139, 88, 139, 50, 50, 88, 139, 88, 139, 50, 50]
  ang_vel_scale: 0.25
  dof_pos_scale: 1.0
  dof_vel_scale: 0.05
  action_scale: 0.25
  command_scale: [2.0, 2.0, 0.25]
  num_actions: 12
  num_observations: 47
  gait_period: 0.8

joystick:
  deadzone: 0.10
  axis_lateral: 0
  axis_forward: 1
  axis_yaw: 2
  max_forward: 1.0
  max_lateral: 1.0
  max_yaw: 1.0
  reset_button: 0
  emergency_stop_button: 1
  resume_button: 3
  quit_button: 9
